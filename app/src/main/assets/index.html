<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a1127"><title>تکلیف‌یار</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div><div class="eyebrow">برنامه‌ریز مدرسه</div><h1>تکلیف‌یار <span>✦</span></h1><p id="todayLine">برنامه‌ات رو مرتب کن؛ با خیال راحت پیش برو.</p></div><div class="avatar">📚</div></header>
<main>
<section class="hero"><div><div class="eyebrow">امروز وقتشه</div><h2 id="heroTitle">قدم‌به‌قدم جلو برو!</h2><p id="heroSub">هر تکلیف کوچک، یک قدم به جلوست.</p></div><div class="heroIcon">✨</div></section>
<section class="cards">
<button class="navCard blue" data-page="due"><span class="cardIcon">🗓️</span><span class="cardTitle">تکالیف فردا</span><span class="cardSub">بررسی و انجام تکالیف</span><span id="dueCount" class="count">۰ تکلیف</span></button>
<button class="navCard purple" data-page="add"><span class="cardIcon">✏️</span><span class="cardTitle">افزودن تکلیف</span><span class="cardSub">ثبت تکلیف جدید</span><span class="arrow">＋</span></button>
<button class="navCard teal" data-page="schedule"><span class="cardIcon">📘</span><span class="cardTitle">برنامه هفتگی</span><span class="cardSub">درس‌ها و زنگ‌های مدرسه</span><span class="arrow">↗</span></button>
</section>
<section id="view" class="panel"></section>
<footer>تکلیف‌یار <span>•</span> برنامه‌ریزی بهتر، آرامش بیشتر 💙</footer>
</main>
<div id="toast" class="toast" role="status"></div>
<script src="app.js"></script>
</body></html>
